name: Sync Upstream and Release

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）检查一次上游更新
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      version_changed: ${{ steps.sync.outputs.version_changed }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream (3899/SimAdmin)
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/3899/SimAdmin.git
          git fetch upstream main

          OLD_VERSION="$(tr -d '[:space:]' < VERSION)"

          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "没有上游更新"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "发现 $NEW_COMMITS 个新提交，合并中..."
          if ! git merge upstream/main --no-edit 2>&1 | tee /tmp/merge_output.txt; then
            echo "合并冲突，尝试自动恢复..."
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "冲突文件: ${CONFLICTED:-无}"
            if [ "$(echo "$CONFLICTED" | grep -c '^backend/src/ota.rs$')" -eq 1 ] && \
               [ "$(echo "$CONFLICTED" | wc -l)" -eq 1 ]; then
              # 已知冲突模式：ota.rs 同时被 fork 定制与上游大版本重构修改。
              # 自动恢复策略：采用上游实现（架构匹配更完善），仅重写 release 源指向本 fork。
              echo "采用上游 ota.rs 并重写发布源..."
              git checkout --theirs backend/src/ota.rs
              sed -i 's|https://api.github.com/repos/3899/SimAdmin/releases/latest|https://api.github.com/repos/Jane-Rui/SimAdmin/releases/latest|' backend/src/ota.rs
              if grep -q "Jane-Rui/SimAdmin" backend/src/ota.rs; then
                git add backend/src/ota.rs
                if ! git commit --no-edit; then
                  echo "提交失败" >&2
                  exit 1
                fi
                echo "✅ 已自动解决 ota.rs 冲突（上游代码 + fork 发布源）"
              else
                echo "❌ 发布源重写失败，请人工处理" >&2
                exit 1
              fi
            else
              echo "❌ 出现未知冲突文件，无法自动恢复。请人工处理：" >&2
              echo "$CONFLICTED" >&2
              exit 1
            fi
          fi
          git push origin HEAD:main

          NEW_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          if [ "${NEW_VERSION}" != "${OLD_VERSION}" ]; then
            echo "版本号变化: ${OLD_VERSION} → ${NEW_VERSION}"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本号未变（仍为 ${NEW_VERSION}），跳过发版"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # 版本号变化才构建发版（同一版本内的上游提交只同步代码，不重复发版）
    if: needs.sync.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch_tag: aarch64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch_tag: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Build backend (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
          SQLITE3_STATIC: '1'
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '0'
        run: |
          case "$TARGET" in
            aarch64-unknown-linux-musl)
              export CC_aarch64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              ;;
            x86_64-unknown-linux-musl)
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              ;;
          esac
          cargo build --locked --release --target "$TARGET" -p simadmin
          file "target/$TARGET/release/simadmin"

      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/pack-ota.sh --target="$TARGET"
          case "$TARGET" in
            aarch64-unknown-linux-musl)
              ARCH_SUFFIX="aarch64"
              ;;
            x86_64-unknown-linux-musl)
              ARCH_SUFFIX="x86_64"
              ;;
          esac
          SOURCE="release/simadmin_${VERSION}_${TARGET}.tar.gz"
          DEST="release/simadmin-${ARCH_SUFFIX}.tar.gz"
          mv "$SOURCE" "$DEST"
          echo "打包完成: $DEST"
          sha256sum release/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-${{ matrix.arch_tag }}
          path: release/simadmin-${{ matrix.arch_tag }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download OTA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ota-*
          path: release
          merge-multiple: true

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.sync.outputs.version }}"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} 已存在，跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          body: |
            自动同步自上游 [3899/SimAdmin](https://github.com/3899/SimAdmin) 并多架构构建。
            包含 x86_64 与 aarch64 (musl) 两个架构的 OTA 包。
          files: |
            release/simadmin-x86_64.tar.gz
            release/simadmin-aarch64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
