name: Sync Upstream and Release

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）检查一次上游更新
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream (3899/SimAdmin)
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/3899/SimAdmin.git
          git fetch upstream main

          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "没有上游更新"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "发现 $NEW_COMMITS 个新提交，合并中..."
          if ! git merge upstream/main --no-edit 2>&1 | tee /tmp/merge_output.txt; then
            echo "合并冲突，尝试自动恢复..."
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "冲突文件: ${CONFLICTED:-无}"
            if [ "$(echo "$CONFLICTED" | grep -c '^backend/src/ota.rs$')" -eq 1 ] && \
               [ "$(echo "$CONFLICTED" | wc -l)" -eq 1 ]; then
              # 已知冲突模式：ota.rs 同时被 fork 定制与上游大版本重构修改。
              # 自动恢复策略：采用上游实现（架构匹配更完善），仅重写 release 源指向本 fork。
              echo "采用上游 ota.rs 并重写发布源..."
              git checkout --theirs backend/src/ota.rs
              sed -i 's|https://api.github.com/repos/3899/SimAdmin/releases/latest|https://api.github.com/repos/Jane-Rui/SimAdmin/releases/latest|' backend/src/ota.rs
              if grep -q "Jane-Rui/SimAdmin" backend/src/ota.rs; then
                git add backend/src/ota.rs
                if ! git commit --no-edit; then
                  echo "提交失败" >&2
                  exit 1
                fi
                echo "✅ 已自动解决 ota.rs 冲突（上游代码 + fork 发布源）"
              else
                echo "❌ 发布源重写失败，请人工处理" >&2
                exit 1
              fi
            else
              echo "❌ 出现未知冲突文件，无法自动恢复。请人工处理：" >&2
              echo "$CONFLICTED" >&2
              exit 1
            fi
          fi
          git push origin HEAD:main

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Build backend (x86_64-unknown-linux-musl，原生，无需交叉工具链)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cd backend
          cargo build --release --target x86_64-unknown-linux-musl

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-musl

      - name: Build backend (aarch64-unknown-linux-musl，原生交叉编译，不走 cross/Docker)
        run: cd backend && cargo build --release --target aarch64-unknown-linux-musl

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.sync.outputs.version }}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%dT%H:%M:%S+08:00")

          declare -A ARCH_TAGS=(
            ["x86_64-unknown-linux-musl"]="x86_64"
            ["aarch64-unknown-linux-musl"]="aarch64"
          )

          for TARGET in "${!ARCH_TAGS[@]}"; do
            ARCH_TAG="${ARCH_TAGS[$TARGET]}"
            STAGE=$(mktemp -d)
            cp "backend/target/$TARGET/release/simadmin" "$STAGE/simadmin"
            chmod 755 "$STAGE/simadmin"
            cp -r frontend/dist "$STAGE/www"

            BINARY_MD5=$(md5sum "$STAGE/simadmin" | cut -d' ' -f1)
            FRONTEND_MD5=$(find "$STAGE/www" -type f -exec md5sum {} \; | cut -d' ' -f1 | sort | md5sum | cut -d' ' -f1)

            cat > "$STAGE/meta.json" << EOF
          {
              "version": "$VERSION",
              "commit": "$COMMIT",
              "build_time": "$BUILD_TIME",
              "binary_md5": "$BINARY_MD5",
              "frontend_md5": "$FRONTEND_MD5",
              "arch": "$TARGET"
          }
          EOF

            tar -czf "simadmin-${ARCH_TAG}.tar.gz" -C "$STAGE" meta.json simadmin www
            echo "打包完成: simadmin-${ARCH_TAG}.tar.gz ($TARGET)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          body: |
            自动同步自上游 [3899/SimAdmin](https://github.com/3899/SimAdmin) 并多架构构建。
            包含 x86_64 与 aarch64 (musl) 两个架构的 OTA 包。
          files: |
            simadmin-x86_64.tar.gz
            simadmin-aarch64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
