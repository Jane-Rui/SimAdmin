name: Sync Upstream and Release

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）检查一次上游更新
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: simadmin-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      version_changed: ${{ steps.sync.outputs.version_changed }}
      version: ${{ steps.sync.outputs.version }}
      source_sha: ${{ steps.sync.outputs.source_sha }}
      release_needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream (3899/SimAdmin)
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/3899/SimAdmin.git
          git fetch upstream main

          OLD_VERSION="$(tr -d '[:space:]' < VERSION)"

          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "没有上游更新"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "发现 $NEW_COMMITS 个新提交，合并中..."
          # 使用 --no-commit 阻止自动提交，以便在提交前隔离工作流目录并解决冲突
          merge_failed=false
          git merge upstream/main --no-ff --no-commit --no-edit || merge_failed=true
          if [ "$merge_failed" = true ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge failed before a resolvable merge state; refusing to publish." >&2
            exit 1
          fi

          # Restore the entire workflow tree, including removal of upstream-only workflows.
          git restore --source=HEAD --staged --worktree -- .github/workflows/

          # 2. 检查是否有冲突
          CONFLICTED=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTED" ]; then
            echo "冲突文件: $CONFLICTED"
            if [ "$(echo "$CONFLICTED" | grep -c '^backend/src/ota.rs$')" -eq 1 ] && \
               [ "$(echo "$CONFLICTED" | wc -l)" -eq 1 ]; then
              echo "采用上游 ota.rs 并重写发布源..."
              git checkout --theirs backend/src/ota.rs
              sed -i 's|https://api.github.com/repos/3899/SimAdmin/releases/latest|https://api.github.com/repos/Jane-Rui/SimAdmin/releases/latest|' backend/src/ota.rs
              if grep -q "Jane-Rui/SimAdmin" backend/src/ota.rs; then
                git add backend/src/ota.rs
                echo "✅ 已自动解决 ota.rs 冲突（上游代码 + fork 发布源）"
              else
                echo "❌ 发布源重写失败，请人工处理" >&2
                exit 1
              fi
            else
              echo "❌ 出现未知冲突文件，无法自动恢复。请人工处理：" >&2
              echo "$CONFLICTED" >&2
              exit 1
            fi
          fi

          # Preserve and verify our OTA source even when the upstream merge is clean.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/ota.rs')
          text = path.read_text()
          old = 'https://api.github.com/repos/3899/SimAdmin/releases/latest'
          own = 'https://api.github.com/repos/Jane-Rui/SimAdmin/releases/latest'
          text = text.replace(old, own)
          if text.count(own) != 1:
              raise SystemExit('Unexpected OTA release source; review before pushing')
          path.write_text(text)
          PY
          git add backend/src/ota.rs
          git diff --cached --exit-code HEAD -- .github/workflows/

          # 3. 提交合并结果
          git commit -m "Merge remote-tracking branch 'upstream/main'" --no-edit
          git push origin HEAD:main

          NEW_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          if [ "${NEW_VERSION}" != "${OLD_VERSION}" ]; then
            echo "版本号变化: ${OLD_VERSION} → ${NEW_VERSION}"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本号未变（仍为 ${NEW_VERSION}），跳过发版"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check release completeness
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/simadmin-releases.json
          python3 - <<'PY'
          import json, os, re
          version = os.environ['VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid VERSION')
          releases = json.load(open('/tmp/simadmin-releases.json'))
          release = next((r for r in releases if r['tag_name'] == 'v' + version), None)
          expected = {'simadmin-aarch64.tar.gz', 'simadmin-x86_64.tar.gz'}
          assets = {a['name'] for a in release['assets'] if a['size'] > 0} if release else set()
          if release and (release['draft'] or release['prerelease'] or not expected <= assets):
              raise SystemExit('Existing release is incomplete/non-stable; review instead of overwriting')
          needed = release is None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('needed=' + str(needed).lower() + '\n')
          print('Release needed:', needed)
          PY

  build:
    needs: sync
    # Retry missing releases even if code was synchronized by a previous failed build.
    if: needs.sync.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch_tag: aarch64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch_tag: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Build backend (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
          SQLITE3_STATIC: '1'
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '0'
        run: |
          case "$TARGET" in
            aarch64-unknown-linux-musl)
              export CC_aarch64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              ;;
            x86_64-unknown-linux-musl)
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              ;;
          esac
          cargo build --locked --release --target "$TARGET" -p simadmin
          file "target/$TARGET/release/simadmin"

      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build/pack-ota.sh --target="$TARGET" --standard
          case "$TARGET" in
            aarch64-unknown-linux-musl)
              ARCH_SUFFIX="aarch64"
              ;;
            x86_64-unknown-linux-musl)
              ARCH_SUFFIX="x86_64"
              ;;
          esac
          SOURCE="release/simadmin_${VERSION}_${TARGET}.tar.gz"
          DEST="release/simadmin-${ARCH_SUFFIX}.tar.gz"
          mv "$SOURCE" "$DEST"
          python3 - "$DEST" "$TARGET" "$VERSION" <<'PY'
          import hashlib, json, struct, sys, tarfile
          path, target, version = sys.argv[1:]
          with tarfile.open(path) as tar:
              members = tar.getmembers()
              if any(m.name.startswith('/') or '..' in m.name.split('/') or m.issym() or m.islnk() for m in members):
                  raise SystemExit('Unsafe archive member')
              meta = json.load(tar.extractfile('meta.json'))
              binary = tar.extractfile('simadmin').read()
              assert meta['version'] == version and meta['arch'] == target and meta['edition'] == 'standard'
              assert binary[:5] == b'\x7fELF\x02'
              machine = struct.unpack('<H', binary[18:20])[0]
              assert machine == (183 if target.startswith('aarch64') else 62)
              assert hashlib.md5(binary).hexdigest() == meta['binary_md5']
              hashes = sorted(hashlib.md5(tar.extractfile(m).read()).hexdigest() for m in members if m.isfile() and m.name.startswith('www/'))
              assert hashes and any(m.name == 'www/index.html' for m in members)
              assert hashlib.md5(('\n'.join(hashes) + '\n').encode()).hexdigest() == meta['frontend_md5']
          print('OTA version/architecture/edition/content checksums verified:', target)
          PY
          echo "打包完成: $DEST"
          sha256sum release/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-${{ matrix.arch_tag }}
          path: release/simadmin-${{ matrix.arch_tag }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download OTA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ota-*
          path: release
          merge-multiple: true

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.sync.outputs.version }}"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} 已存在，跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync.outputs.version }}
          name: v${{ needs.sync.outputs.version }}
          target_commitish: ${{ needs.sync.outputs.source_sha }}
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            自动同步自上游 [3899/SimAdmin](https://github.com/3899/SimAdmin) 并多架构构建。
            包含 x86_64 与 aarch64 (musl) 两个架构的 OTA 包。
          files: |
            release/simadmin-x86_64.tar.gz
            release/simadmin-aarch64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}